<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极视云直播 - 电视节目首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">TV</div>
          <div>
            <div class="brand-name">极视云直播</div>
            <div class="brand-sub">LIVE · TV CLOUD</div>
          </div>
        </div>

        <nav class="main-nav" aria-label="主导航">
          <a href="#" class="nav-item active" data-view="首页">首页</a>
          <a href="#" class="nav-item" data-view="直播">直播</a>
          <a href="#" class="nav-item" data-view="电视剧">电视剧</a>
          <a href="#" class="nav-item" data-view="电影">电影</a>
          <a href="#" class="nav-item" data-view="综艺">综艺</a>
          <a href="#" class="nav-item" data-view="动漫">动漫</a>
        </nav>

        <div class="toolbar">
          <div class="search-box">
            <span>⌕</span>
            <input type="text" value="CCTV 5 + NBA" aria-label="搜索频道" />
          </div>
          <button id="settingsButton" class="settings-btn">设置</button>
        </div>
      </header>

      <div class="broadcast-layout">
        <aside class="channel-panel">
          <div class="panel-header">
            <div>
              <div class="eyebrow small">频道库</div>
              <h2 id="panelTitle">频道列表</h2>
            </div>
            <button class="mini-btn" id="panelToggle">全部</button>
          </div>

          <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="全部">全部</button>
            <button class="filter-btn" data-filter="体育">体育</button>
            <button class="filter-btn" data-filter="新闻">新闻</button>
            <button class="filter-btn" data-filter="电影">电影</button>
            <button class="filter-btn" data-filter="综艺">综艺</button>
          </div>

          <div id="channelList" class="channel-list"></div>
        </aside>

        <main class="main-panel">
          <section class="feature-panel">
            <div class="player-header">
              <div class="live-tag-group">
                <span class="live-tag" id="streamBadge">LIVE</span>
                <span class="status-text" id="statusText">HD 1080P</span>
              </div>
              <div class="player-actions">
                <button>全屏</button>
                <button>倍速</button>
                <button>收藏</button>
              </div>
            </div>

            <div class="video-shell">
              <video id="videoPlayer" class="video-player" controls playsinline autoplay muted></video>
              <div class="video-overlay">
                <div class="play-indicator">▶</div>
              </div>
              <div class="video-info">
                <div class="info-left">
                  <div id="channelTitle" class="channel-title">CCTV-5 体育</div>
                  <div id="channelMeta" class="channel-meta">高清 · 1080P · 中国大陆</div>
                </div>
                <div class="info-right">
                  <div class="chip" id="programChip">节目中</div>
                  <div id="currentTime" class="live-time">00:00:00</div>
                </div>
              </div>
            </div>

            <div class="program-strip">
              <div class="program-pill active">NBA</div>
              <div class="program-pill">世界杯</div>
              <div class="program-pill">国际足球</div>
              <div class="program-pill">电竞</div>
              <div class="program-pill">娱乐</div>
            </div>
          </section>

          <section class="epg-panel">
            <div class="epg-header">
              <h3 id="epgTitle">节目单</h3>
              <a href="#">查看全部</a>
            </div>

            <div class="epg-grid" id="epgGrid"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="settingsModal" class="settings-modal hidden" aria-hidden="true">
      <div class="settings-panel">
        <div class="settings-header">
          <h3>影视资源 API 设置</h3>
          <button id="closeSettings" class="close-btn">✕</button>
        </div>

        <form id="apiConfigForm" class="settings-form">
          <label>
            <span>首页 API</span>
            <input type="url" name="首页" placeholder="https://example.com/api/home.json" />
          </label>
          <label>
            <span>直播 API</span>
            <input type="url" name="直播" placeholder="https://example.com/api/live.json" />
          </label>
          <label>
            <span>电视剧 API</span>
            <input type="url" name="电视剧" placeholder="https://example.com/api/series.json" />
          </label>
          <label>
            <span>电影 API</span>
            <input type="url" name="电影" placeholder="https://example.com/api/movies.json" />
          </label>
          <label>
            <span>综艺 API</span>
            <input type="url" name="综艺" placeholder="https://example.com/api/variety.json" />
          </label>
          <label>
            <span>动漫 API</span>
            <input type="url" name="动漫" placeholder="https://example.com/api/anime.json" />
          </label>

          <div class="settings-actions">
            <button type="button" id="resetApiConfig" class="secondary-btn">恢复默认</button>
            <button type="submit" class="primary-btn">保存设置</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
