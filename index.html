<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极视云直播 - 首页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">TV</div>
          <div>
            <div class="brand-name">极视云直播</div>
            <div class="brand-sub">LIVE · TV CLOUD</div>
          </div>
        </div>

        <nav class="main-nav" aria-label="主导航">
          <a href="#" class="nav-item active">首页</a>
          <a href="#" class="nav-item">直播</a>
          <a href="#" class="nav-item">体育</a>
          <a href="#" class="nav-item">电影</a>
          <a href="#" class="nav-item">综艺</a>
          <a href="#" class="nav-item">儿童</a>
        </nav>

        <div class="toolbar">
          <div class="search-box">
            <span>⌕</span>
            <input type="text" value="CCTV 5 + NBA" aria-label="搜索频道" />
          </div>
          <button class="user-pill">登录</button>
        </div>
      </header>

      <div class="live-layout">
        <aside class="channel-panel">
          <div class="panel-header">
            <div>
              <div class="eyebrow small">频道库</div>
              <h2>频道列表</h2>
            </div>
            <button class="mini-btn">全部</button>
          </div>

          <div class="filter-bar">
            <button class="filter-btn active">全部</button>
            <button class="filter-btn">体育</button>
            <button class="filter-btn">新闻</button>
            <button class="filter-btn">电影</button>
            <button class="filter-btn">综艺</button>
          </div>

          <div id="channelList" class="channel-list"></div>
        </aside>

        <main class="main-panel">
          <section class="featured-card">
            <div class="player-header">
              <div class="live-tag-group">
                <span class="live-tag">LIVE</span>
                <span class="status-text">HD 1080P</span>
              </div>
              <div class="player-actions">
                <button>全屏</button>
                <button>倍速</button>
                <button>收藏</button>
              </div>
            </div>

            <div class="video-shell">
              <video id="videoPlayer" class="video-player" controls playsinline autoplay muted></video>
              <div class="video-overlay">
                <div class="play-indicator">▶</div>
              </div>
              <div class="video-info">
                <div class="info-left">
                  <div id="channelTitle" class="channel-title">CCTV-5 体育</div>
                  <div id="channelMeta" class="channel-meta">高清 · 1080P · 中国大陆</div>
                </div>
                <div id="currentTime" class="live-time">00:00:00</div>
              </div>
            </div>

            <div class="program-strip">
              <div class="program-pill active">NBA</div>
              <div class="program-pill">世界杯</div>
              <div class="program-pill">国际足球</div>
              <div class="program-pill">电竞</div>
              <div class="program-pill">娱乐</div>
            </div>
          </section>

          <section class="content-row">
            <div class="mini-panel">
              <div class="mini-header">
                <h3>节目单</h3>
                <a href="#">查看全部</a>
              </div>

              <div class="schedule-list">
                <div class="schedule-item">
                  <span class="schedule-time">19:00</span>
                  <div>
                    <strong>新闻联播</strong>
                    <small>CCTV-1</small>
                  </div>
                </div>
                <div class="schedule-item">
                  <span class="schedule-time">20:00</span>
                  <div>
                    <strong>中国好声音</strong>
                    <small>CCTV-3</small>
                  </div>
                </div>
                <div class="schedule-item">
                  <span class="schedule-time">21:00</span>
                  <div>
                    <strong>NBA 直播</strong>
                    <small>CCTV-5</small>
                  </div>
                </div>
                <div class="schedule-item">
                  <span class="schedule-time">22:30</span>
                  <div>
                    <strong>电影频道</strong>
                    <small>电影台</small>
                  </div>
                </div>
              </div>
            </div>

            <div class="mini-panel">
              <div class="mini-header">
                <h3>热门推荐</h3>
                <a href="#">更多</a>
              </div>

              <div class="recommend-list">
                <div class="recommend-item">
                  <div class="recommend-thumb thumb-one"></div>
                  <div>
                    <strong>赛事直播</strong>
                    <small>体育 · 热门</small>
                  </div>
                </div>
                <div class="recommend-item">
                  <div class="recommend-thumb thumb-two"></div>
                  <div>
                    <strong>时事新闻</strong>
                    <small>新闻 · 实时</small>
                  </div>
                </div>
                <div class="recommend-item">
                  <div class="recommend-thumb thumb-three"></div>
                  <div>
                    <strong>经典电影</strong>
                    <small>电影 · 经典</small>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
